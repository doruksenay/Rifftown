# Tek sunuculu kurulum: veritabanı + API + zamanlayıcı + otomatik HTTPS.
# Kullanım (deploy klasöründe): docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rifftown
      POSTGRES_USER: rifftown
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env dosyasında tanımlı olmalı}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifftown -d rifftown"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: rifftown-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rifftown:${DB_PASSWORD}@db:5432/rifftown
      GAME_SPEED: ${GAME_SPEED:-1}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-destek@ornek.com}
      # Önünde tek vekil var (Caddy): X-Forwarded-For'un en sağındaki adres istemcidir. README "İstemci adresi".
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      PORT: 3000

  # Oyuncular çevrimdışıyken eylemleri ve konserleri sonuçlandıran süreç
  worker:
    image: rifftown-server
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgres://rifftown:${DB_PASSWORD}@db:5432/rifftown
      GAME_SPEED: ${GAME_SPEED:-1}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    command: ["node", "dist/worker-main.js"]

  # Alan adı için Let's Encrypt sertifikasını kendisi alır ve yeniler
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env dosyasında tanımlı olmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:
