# Render Blueprint: Rifftown oyun sunucusu (API + zamanlayıcı tek süreçte).
# Render panelinde "New → Blueprint" ile bu depo seçilince kurulur; main dalına her
# yüklemede sunucu yeniden derlenir. Veritabanı Neon'da (README → "Canlıya alma").

services:
  - type: web
    name: rifftown-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Sadece sunucuyu etkileyen değişikliklerde yeniden derle (mobil uygulama değişiklikleri derlemez)
    buildFilter:
      paths:
        - server/**
        - packages/shared/**
        - Dockerfile
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      # Neon → Connect → "Connection pooling" açık adres (-pooler içerir)
      - key: DATABASE_URL
        sync: false
      # Neon → Connect → "Connection pooling" kapalı adres (veritabanı güncellemeleri için)
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Yönetici olabilecek e-posta(lar), virgülle. Kayıt tek başına yönetici yapmaz: ADMIN_CLAIM_SECRET koduyla panelden
      # (/admin → "Yönetici kodu") yükseltilir. Kod boşsa yalnızca make-admin komutu.
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_CLAIM_SECRET
        sync: false
      # Şartlarda, gizlilik politikasında ve uygulamada görünen iletişim adresi
      - key: CONTACT_EMAIL
        sync: false
      # Zamanlayıcı API ile aynı süreçte (ücretsiz planda ayrı arka plan servisi yok)
      - key: RUN_WORKER
        value: "1"
      # 1 = gerçek zaman. Test için hızlandırmak istersen artır (ör. 6: 4 saatlik iş 40 dakika)
      - key: GAME_SPEED
        value: "1"
      # Uyuyan Neon veritabanını daha az uyandırmak için 5 saniyede bir kontrol
      - key: WORKER_INTERVAL_MS
        value: "5000"
      - key: PG_POOL_MAX
        value: "5"
      # İstemci adresi (kayıt sınırı ve istek sınırı). Render trafiği Cloudflare'den geçirir: cf-connecting-ip kenarda
      # yazılır, istemci değiştiremez. Başlık yoksa X-Forwarded-For'un en sağındaki (Render vekilinin eklediği) adres
      # kullanılır; Render istemcinin gönderdiği X-Forwarded-For'u silmeden eklediği için soldaki değerlere güvenilmez.
      # Kod bu değerleri RENDER=true iken zaten varsayar; burada açıkça yazılı. Ayrıntı: README "İstemci adresi".
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUST_PROXY_HOPS
        value: "1"
