# Her yüklemede: tip kontrolü, sunucu testleri (gerçek PostgreSQL ile) ve Docker imajının derlenmesi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rifftown_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rifftown_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Görselleri doğrula (eksikler hata değil; hatalı dosya ya da sahipsiz görsel varsa düşer)
        run: npm run art:validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sunucu imajını derle (Render'ın derleyeceği imajın aynısı)
        run: docker build -t rifftown-server .
